# Register the package-owned Agent presets when this bundle is installed in a
# Web profile. Shipped and user preset roots remain enabled.

- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js >-
          process.getBuiltinModule('node:path').join(
            ctx.get('pluginPackages').packageOf('harness-all-in-dsh', baseUrl).dir,
            'presets'
          )
        trust: system

# Headless fixed-harness profiles remove DSH mechanisms that would otherwise
# turn the selected Harness into a hybrid. Web already owns these host rows;
# each Agent preset composes only the model-facing mechanisms it needs.

- id: plan-mode
  disabled: true

- id: goal-round-driver
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-todo
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: image-offload
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

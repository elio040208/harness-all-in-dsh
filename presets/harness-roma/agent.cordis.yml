- id: common-tools
  name: cordis:include
  config:
    path: ../_shared/agent-tools.cordis.yml

- id: harness
  name: harness-all-in-dsh
  config:
    harness: roma
    subagentProvider: spawn
    romaMaxDepth: 2
    romaMaxNodes: 15
    romaMaxChildren: 4
    romaMaxParallel: 4
    auxiliaryMaxTokens: 8192
    controllerReminderLimit: 2
